packages:
  - site
  # One package per framework a skin ships in. A folder still in the old one-package shape (`skins/<name>/package.json`)
  # matches neither glob, so it stays out of the workspace until it is converted.
  - 'skins/*/react'
  - 'skins/*/html'
  - 'scripts/*'

allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  unrs-resolver: true

catalog:
  vite-plus: 0.3.3
  # The Video.js release every skin targets; `skin.json.videojs` must match it (scripts/build-registry checks).
  '@videojs/core': 10.2.0
  '@videojs/html': 10.2.0
  '@videojs/mux-audio': 10.2.0
  '@videojs/mux-video': 10.2.0
  '@videojs/react': 10.2.0

# vite-plus bundles its own Vite core (as `vite`) for vitest, which trips vitest's `vite` peer range.
peerDependencyRules:
  allowAny:
    - vite
    - vitest

minimumReleaseAgeExclude:
  - '@posthog/core@1.55.2'
  - posthog-js@1.434.12

# Next's own declaration files resolve `react` from the hoisted copy under .pnpm/node_modules; pin the workspace to the
# React 19 types the site and the skins are built against so no transitive React 18 types win the hoist.
overrides:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
