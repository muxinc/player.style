name: CD

concurrency: production

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  release:
    needs: [lint]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write

    # Release-please only versions the site on main; nothing is published to npm from here. The Media Chrome theme
    # packages publish from the `media-chrome` branch. The Video.js 10 skins under `skins/*` are not wired up yet; see
    # "Publishing" in docs/porting/README.md for what remains.
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
