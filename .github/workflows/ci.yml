name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Where the fit check's browsers are installed and looked up; node_modules is outside every lint and format glob.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each skins/<name>/<framework> package builds dist/<preset>.js, which the fit check and the site load.
      - run: pnpm build:skins
      # The shadcn registry under `site/public/r`, built from the skins' sources (its tests rebuild it in a scratch directory).
      - run: pnpm build:registry
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The fit check (scripts/fit-check) renders every skin on a phone in Chromium and, when it installs, WebKit, the
      # engine an iPhone runs; without WebKit it skips that engine. The pinned playwright-core CLI installs the browser
      # builds its version expects.
      - run: pnpm -F fit-check exec playwright-core install --with-deps chromium
      - run: pnpm -F fit-check exec playwright-core install --with-deps webkit
        continue-on-error: true
      - run: pnpm test
      # Fresh Vite React and vanilla-TS apps run the stock shadcn CLI against `site/public/r` served on localhost, then
      # build and screenshot in the Chromium installed above. It needs the npm registry, nothing deployed and no secrets.
      - run: pnpm -F build-registry e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` builds the skin packages under `skins/*/*` first, then the registry, then the site that loads them.
      - run: pnpm build
