name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:skins
      # The apps under `examples/*` install the skins as a user would and build from their `dist`: a broken export map,
      # `sideEffects` entry or stylesheet export fails here.
      - run: pnpm build:examples
      # The shadcn registry under `site/public/r`, built from the skins' open files (its tests rebuild it in a scratch directory).
      - run: pnpm build:registry
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` builds the skins under `skins/*` first, then the site that imports them.
      - run: pnpm build
      # The root package ships every skin's `dist`; the dry run fails on a missing file or a broken `files` glob.
      - run: npm pack --dry-run
