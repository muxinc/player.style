name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Where the fit check's browsers are installed and looked up; node_modules is outside every lint and format glob.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:skins
      # The apps under `examples/*` install the skins as a user would and build from their `dist`: a broken export map,
      # `sideEffects` entry or stylesheet export fails here.
      - run: pnpm build:examples
      # The shadcn registry under `site/public/r`, built from the skins' open files (its tests rebuild it in a scratch directory).
      - run: pnpm build:registry
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The fit check (scripts/fit-check) renders every skin on a phone in Chromium and, when it installs, WebKit, the
      # engine an iPhone runs; without WebKit it skips that engine. The pinned playwright-core CLI installs the browser
      # builds its version expects.
      - run: pnpm -F fit-check exec playwright-core install --with-deps chromium
      - run: pnpm -F fit-check exec playwright-core install --with-deps webkit
        continue-on-error: true
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` builds the skins under `skins/*` first, then the site that imports them.
      - run: pnpm build
      # The root package ships every skin's `dist`; the dry run fails on a missing file or a broken `files` glob.
      - run: npm pack --dry-run
