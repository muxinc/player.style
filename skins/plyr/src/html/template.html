<!--
  Plyr for Video.js 10, HTML element. Stamped into the shadow root of <plyr-skin>.
  Keep the markup in step with ../react/index.tsx: same elements, same class names, same icon paths.
-->
<media-container class="media-skin ps-plyr" data-theme="plyr" data-preset="video">
  <!-- The page's media element (and any other light-DOM children) land here. -->
  <slot></slot>

  <media-poster class="ps-poster">
    <slot name="poster">
      <img class="ps-poster-image" alt="" decoding="async" />
    </slot>
  </media-poster>

  <!-- A click on the picture plays or pauses and a double click toggles fullscreen, as Plyr's container did. -->
  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <media-gesture type="doubletap" action="toggleFullscreen" pointer="mouse"></media-gesture>
  <!-- Plyr's `keyboard: { focused: true }` shortcuts. -->
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep" value="0.1"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep" value="-0.1"></media-hotkey>
  <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>

  <!-- The large play button, over the picture whenever playback is not running. -->
  <media-play-button class="ps-big-play">
    <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 18">
      <path
        d="M15.562 8.1 3.87.225c-.818-.562-1.87 0-1.87.9v15.75c0 .9 1.052 1.462 1.87.9L15.563 9.9c.584-.45.584-1.35 0-1.8"
      />
    </svg>
  </media-play-button>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
      <media-dialog-close class="ps-dialog-close">Dismiss</media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls class="ps-controls">
    <media-controls-content class="ps-layer">
      <!-- The control bar over its black gradient, in Plyr's default `controls` order. -->
      <div class="ps-controls-bar">
        <media-play-button class="ps-button ps-play-button">
          <svg class="ps-icon ps-icon-play" aria-hidden="true" viewBox="0 0 18 18">
            <path
              d="M15.562 8.1 3.87.225c-.818-.562-1.87 0-1.87.9v15.75c0 .9 1.052 1.462 1.87.9L15.563 9.9c.584-.45.584-1.35 0-1.8"
            />
          </svg>
          <svg class="ps-icon ps-icon-pause" aria-hidden="true" viewBox="0 0 18 18">
            <path
              d="M6 1H3c-.6 0-1 .4-1 1v14c0 .6.4 1 1 1h3c.6 0 1-.4 1-1V2c0-.6-.4-1-1-1m6 0c-.6 0-1 .4-1 1v14c0 .6.4 1 1 1h3c.6 0 1-.4 1-1V2c0-.6-.4-1-1-1z"
            />
          </svg>
        </media-play-button>

        <!--
          The progress bar. The slider is inset half a thumb from either end, so the thumb's centre travels its whole
          width, while the track, buffer and loading stripes reach back out to the container's edges as Plyr's did.
        -->
        <div class="ps-progress-container">
          <media-time-slider class="ps-progress">
            <media-slider-track class="ps-progress-track">
              <media-slider-buffer class="ps-progress-buffer"></media-slider-buffer>
              <media-buffering-indicator class="ps-progress-loading" delay="250"></media-buffering-indicator>
              <media-slider-fill class="ps-progress-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="ps-thumb ps-progress-thumb"></media-slider-thumb>
            <media-slider-preview class="ps-tooltip" overflow="visible">
              <media-slider-value class="ps-tooltip-value" type="pointer"></media-slider-value>
            </media-slider-preview>
          </media-time-slider>
        </div>

        <!-- Plyr's current-time slot: the duration until playback starts, then the time left. -->
        <media-time class="ps-time ps-time-duration" type="duration"></media-time>
        <media-time class="ps-time ps-time-remaining" type="remaining"></media-time>

        <div class="ps-volume">
          <media-mute-button class="ps-button ps-mute-button">
            <svg class="ps-icon ps-icon-muted" aria-hidden="true" viewBox="0 0 18 18">
              <path
                d="m12.4 12.5 2.1-2.1 2.1 2.1 1.4-1.4L15.9 9 18 6.9l-1.4-1.4-2.1 2.1-2.1-2.1L11 6.9 13.1 9 11 11.1zM3.786 6.008H.714C.286 6.008 0 6.31 0 6.76v4.512c0 .452.286.752.714.752h3.072l4.071 3.858c.5.3 1.143 0 1.143-.602V2.752c0-.601-.643-.977-1.143-.601z"
              />
            </svg>
            <svg class="ps-icon ps-icon-volume" aria-hidden="true" viewBox="0 0 18 18">
              <path
                d="M15.6 3.3c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4C15.4 5.9 16 7.4 16 9s-.6 3.1-1.8 4.3c-.4.4-.4 1 0 1.4.2.2.5.3.7.3.3 0 .5-.1.7-.3C17.1 13.2 18 11.2 18 9s-.9-4.2-2.4-5.7"
              />
              <path
                d="M11.282 5.282a.91.91 0 0 0 0 1.316c.735.735.995 1.458.995 2.402 0 .936-.425 1.917-.995 2.487a.91.91 0 0 0 0 1.316c.145.145.636.262 1.018.156a.7.7 0 0 0 .298-.156C13.773 11.733 14.13 10.16 14.13 9q.001-.255-.011-.51c-.053-.992-.319-2.005-1.522-3.208a.91.91 0 0 0-1.316 0m-7.495.726H.714C.286 6.008 0 6.31 0 6.76v4.512c0 .452.286.752.714.752h3.072l4.071 3.858c.5.3 1.143 0 1.143-.602V2.752c0-.601-.643-.977-1.143-.601z"
              />
            </svg>
          </media-mute-button>
          <media-volume-slider class="ps-volume-slider">
            <media-slider-track class="ps-volume-track">
              <media-slider-fill class="ps-volume-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="ps-thumb ps-volume-thumb"></media-slider-thumb>
          </media-volume-slider>
        </div>

        <media-captions-button class="ps-button ps-captions-button">
          <svg class="ps-icon ps-icon-captions-off" aria-hidden="true" viewBox="0 0 18 18">
            <path
              fill-opacity=".5"
              fill-rule="evenodd"
              d="M1 1c-.6 0-1 .4-1 1v11c0 .6.4 1 1 1h4.6l2.7 2.7c.2.2.4.3.7.3s.5-.1.7-.3l2.7-2.7H17c.6 0 1-.4 1-1V2c0-.6-.4-1-1-1zm4.52 10.15c1.99 0 3.01-1.32 3.28-2.41l-1.29-.39c-.19.66-.78 1.45-1.99 1.45-1.14 0-2.2-.83-2.2-2.34 0-1.61 1.12-2.37 2.18-2.37 1.23 0 1.78.75 1.95 1.43l1.3-.41C8.47 4.96 7.46 3.76 5.5 3.76c-1.9 0-3.61 1.44-3.61 3.7s1.65 3.69 3.63 3.69m7.57 0c1.99 0 3.01-1.32 3.28-2.41l-1.29-.39c-.19.66-.78 1.45-1.99 1.45-1.14 0-2.2-.83-2.2-2.34 0-1.61 1.12-2.37 2.18-2.37 1.23 0 1.78.75 1.95 1.43l1.3-.41c-.28-1.15-1.29-2.35-3.25-2.35-1.9 0-3.61 1.44-3.61 3.7s1.65 3.69 3.63 3.69"
            />
          </svg>
          <svg class="ps-icon ps-icon-captions-on" aria-hidden="true" viewBox="0 0 18 18">
            <path
              fill-rule="evenodd"
              d="M1 1c-.6 0-1 .4-1 1v11c0 .6.4 1 1 1h4.6l2.7 2.7c.2.2.4.3.7.3s.5-.1.7-.3l2.7-2.7H17c.6 0 1-.4 1-1V2c0-.6-.4-1-1-1zm4.52 10.15c1.99 0 3.01-1.32 3.28-2.41l-1.29-.39c-.19.66-.78 1.45-1.99 1.45-1.14 0-2.2-.83-2.2-2.34 0-1.61 1.12-2.37 2.18-2.37 1.23 0 1.78.75 1.95 1.43l1.3-.41C8.47 4.96 7.46 3.76 5.5 3.76c-1.9 0-3.61 1.44-3.61 3.7s1.65 3.69 3.63 3.69m7.57 0c1.99 0 3.01-1.32 3.28-2.41l-1.29-.39c-.19.66-.78 1.45-1.99 1.45-1.14 0-2.2-.83-2.2-2.34 0-1.61 1.12-2.37 2.18-2.37 1.23 0 1.78.75 1.95 1.43l1.3-.41c-.28-1.15-1.29-2.35-3.25-2.35-1.9 0-3.61 1.44-3.61 3.7s1.65 3.69 3.63 3.69"
            />
          </svg>
        </media-captions-button>

        <!-- Settings: Captions, Quality and Speed pages, each shown only when the media offers the choice. -->
        <button type="button" class="ps-button ps-settings-button" commandfor="plyr-settings" aria-label="Settings">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 18">
            <path
              d="M16.135 7.784a2 2 0 0 1-1.23-2.969c.322-.536.225-.998-.094-1.316l-.31-.31c-.318-.318-.78-.415-1.316-.094a2 2 0 0 1-2.969-1.23C10.065 1.258 9.669 1 9.219 1h-.438c-.45 0-.845.258-.997.865a2 2 0 0 1-2.969 1.23c-.536-.322-.999-.225-1.317.093l-.31.31c-.318.318-.415.781-.093 1.317a2 2 0 0 1-1.23 2.969C1.26 7.935 1 8.33 1 8.781v.438c0 .45.258.845.865.997a2 2 0 0 1 1.23 2.969c-.322.536-.225.998.094 1.316l.31.31c.319.319.782.415 1.316.094a2 2 0 0 1 2.969 1.23c.151.607.547.865.997.865h.438c.45 0 .845-.258.997-.865a2 2 0 0 1 2.969-1.23c.535.321.997.225 1.316-.094l.31-.31c.318-.318.415-.781.094-1.316a2 2 0 0 1 1.23-2.969c.607-.151.865-.547.865-.997v-.438c0-.451-.26-.846-.865-.997M9 12a3 3 0 1 1 0-6 3 3 0 0 1 0 6"
            />
          </svg>
        </button>
        <media-menu class="ps-menu" id="plyr-settings" side="top" align="end">
          <media-menu-content class="ps-menu-content">
            <media-menu-item class="ps-menu-item ps-menu-forward" commandfor="plyr-captions">
              <span class="ps-menu-label">Captions</span>
              <span class="ps-menu-value" data-part="hint"></span>
            </media-menu-item>
            <media-menu-item class="ps-menu-item ps-menu-forward" commandfor="plyr-quality">
              <span class="ps-menu-label">Quality</span>
              <span class="ps-menu-value" data-part="hint"></span>
            </media-menu-item>
            <media-menu-item class="ps-menu-item ps-menu-forward" commandfor="plyr-speed">
              <span class="ps-menu-label">Speed</span>
              <span class="ps-menu-value" data-part="hint"></span>
            </media-menu-item>
          </media-menu-content>

          <media-menu-content class="ps-menu-content" id="plyr-captions">
            <media-menu-item class="ps-menu-item ps-menu-back">Captions</media-menu-item>
            <media-captions-radio-group class="ps-menu-group">
              <template>
                <media-menu-radio-item class="ps-menu-item ps-menu-radio">
                  <span class="ps-menu-label" data-part="label"></span>
                </media-menu-radio-item>
              </template>
            </media-captions-radio-group>
          </media-menu-content>

          <media-menu-content class="ps-menu-content" id="plyr-quality">
            <media-menu-item class="ps-menu-item ps-menu-back">Quality</media-menu-item>
            <media-quality-radio-group class="ps-menu-group">
              <template>
                <media-menu-radio-item class="ps-menu-item ps-menu-radio">
                  <span class="ps-menu-label" data-part="label"></span>
                  <span class="ps-menu-badge" data-part="badge"></span>
                </media-menu-radio-item>
              </template>
            </media-quality-radio-group>
          </media-menu-content>

          <media-menu-content class="ps-menu-content" id="plyr-speed">
            <media-menu-item class="ps-menu-item ps-menu-back">Speed</media-menu-item>
            <media-playback-rate-radio-group class="ps-menu-group">
              <template>
                <media-menu-radio-item class="ps-menu-item ps-menu-radio">
                  <span class="ps-menu-label" data-part="label"></span>
                </media-menu-radio-item>
              </template>
            </media-playback-rate-radio-group>
          </media-menu-content>
        </media-menu>

        <media-pip-button class="ps-button ps-pip-button">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 18">
            <path d="M13.293 3.293 7.022 9.564l1.414 1.414 6.271-6.271L17 7V1h-6z" />
            <path d="M13 15H3V5h5V3H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6h-2z" />
          </svg>
        </media-pip-button>

        <media-airplay-button class="ps-button ps-airplay-button">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 18">
            <path d="M16 1H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3v-2H3V3h12v8h-2v2h3a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1" />
            <path d="M4 17h10l-5-6z" />
          </svg>
        </media-airplay-button>

        <media-fullscreen-button class="ps-button ps-fullscreen-button">
          <svg class="ps-icon ps-icon-fullscreen-enter" aria-hidden="true" viewBox="0 0 18 18">
            <path d="M10 3h3.6l-4 4L11 8.4l4-4V8h2V1h-7zM7 9.6l-4 4V10H1v7h7v-2H4.4l4-4z" />
          </svg>
          <svg class="ps-icon ps-icon-fullscreen-exit" aria-hidden="true" viewBox="0 0 18 18">
            <path d="M1 12h3.6l-4 4L2 17.4l4-4V17h2v-7H1zM16 .6l-4 4V1h-2v7h7V6h-3.6l4-4z" />
          </svg>
        </media-fullscreen-button>
      </div>
    </media-controls-content>
  </media-controls>
</media-container>
