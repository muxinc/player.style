<!--
  Mux Player for Video.js 10, HTML element. Stamped into the shadow root of <mux-player-skin>.
  Keep the markup in step with ../react/index.tsx: same elements, same class names, same icon paths.
-->
<media-container class="media-skin ps-mux-player" data-theme="mux-player" data-preset="video">
  <!-- The page's media element (and any other light-DOM children) land here. -->
  <slot></slot>

  <media-poster class="ps-poster">
    <slot name="poster">
      <img class="ps-poster-image" alt="" decoding="async" />
    </slot>
  </media-poster>

  <!--
    A click on the picture plays or pauses and a tap shows or hides the controls, as media-chrome did; the keys are
    media-chrome's default hotkeys, which Mux Player keeps.
  -->
  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="j" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="l" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep" value="0.025"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep" value="-0.025"></media-hotkey>

  <!-- media-chrome's rotating arc, 0.5s into a stall. -->
  <media-buffering-indicator class="ps-loading" delay="500">
    <svg class="ps-loading-icon" aria-hidden="true" viewBox="0 0 100 100">
      <path d="M73,50c0-12.7-10.3-23-23-23S27,37.3,27,50 M30.9,50c0-10.5,8.5-19.1,19.1-19.1S69.1,39.5,69.1,50" />
    </svg>
  </media-buffering-indicator>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
      <media-dialog-close class="ps-dialog-close">Dismiss</media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls class="ps-controls">
    <media-controls-content class="ps-layer">
      <!-- The title bar, from the player's `content-title`, over its own gradient. -->
      <div class="ps-top">
        <media-title class="ps-title"></media-title>
      </div>

      <!--
        The centre button: the big black circle before the first play (it pops away once playback starts), or the
        plain play/pause toggle below 470px, as the original's `breakpointsm` switched them.
      -->
      <div class="ps-center">
        <media-play-button class="ps-center-play">
          <svg class="ps-icon ps-pre-play-icon" aria-hidden="true" viewBox="0 0 18 14">
            <path
              d="M15.5987 6.2911L3.45577 0.110898C2.83667 -0.204202 2.06287 0.189698 2.06287 0.819798V13.1802C2.06287 13.8103 2.83667 14.2042 3.45577 13.8891L15.5987 7.7089C16.2178 7.3938 16.2178 6.6061 15.5987 6.2911Z"
            />
          </svg>
          <svg class="ps-icon ps-play-icons" aria-hidden="true" viewBox="0 0 18 14">
            <g class="ps-play-icon">
              <path
                d="M15.5987 6.2911L3.45577 0.110898C2.83667 -0.204202 2.06287 0.189698 2.06287 0.819798V13.1802C2.06287 13.8103 2.83667 14.2042 3.45577 13.8891L15.5987 7.7089C16.2178 7.3938 16.2178 6.6061 15.5987 6.2911Z"
              />
            </g>
            <g class="ps-pause-icon">
              <path
                class="ps-pause-pt1"
                d="M5.90709 0H2.96889C2.46857 0 2.06299 0.405585 2.06299 0.9059V13.0941C2.06299 13.5944 2.46857 14 2.96889 14H5.90709C6.4074 14 6.81299 13.5944 6.81299 13.0941V0.9059C6.81299 0.405585 6.4074 0 5.90709 0Z"
              />
              <path
                class="ps-pause-pt2"
                d="M15.1571 0H12.2189C11.7186 0 11.313 0.405585 11.313 0.9059V13.0941C11.313 13.5944 11.7186 14 12.2189 14H15.1571C15.6574 14 16.063 13.5944 16.063 13.0941V0.9059C16.063 0.405585 15.6574 0 15.1571 0Z"
              />
            </g>
          </svg>
        </media-play-button>
      </div>

      <!-- The seek bar rides on the control bar's top edge; the preview arrow follows the pointer. -->
      <media-time-slider class="ps-time-range">
        <media-slider-track class="ps-time-track">
          <media-slider-buffer class="ps-time-buffer"></media-slider-buffer>
          <media-slider-fill class="ps-time-fill"></media-slider-fill>
        </media-slider-track>
        <media-slider-thumb class="ps-time-thumb"></media-slider-thumb>
        <media-slider-preview class="ps-preview" overflow="clamp">
          <media-slider-thumbnail class="ps-preview-thumbnail"></media-slider-thumbnail>
          <media-slider-value class="ps-preview-time" type="pointer"></media-slider-value>
        </media-slider-preview>
        <div class="ps-preview-arrow"></div>
      </media-time-slider>

      <!-- The control bar, in the original's order. Buttons the media cannot use drop out. -->
      <media-tooltip-group class="ps-bar">
        <media-play-button class="ps-button ps-play-button" id="mp-play">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 14">
            <g class="ps-play-icon">
              <path
                d="M15.5987 6.2911L3.45577 0.110898C2.83667 -0.204202 2.06287 0.189698 2.06287 0.819798V13.1802C2.06287 13.8103 2.83667 14.2042 3.45577 13.8891L15.5987 7.7089C16.2178 7.3938 16.2178 6.6061 15.5987 6.2911Z"
              />
            </g>
            <g class="ps-pause-icon">
              <path
                class="ps-pause-pt1"
                d="M5.90709 0H2.96889C2.46857 0 2.06299 0.405585 2.06299 0.9059V13.0941C2.06299 13.5944 2.46857 14 2.96889 14H5.90709C6.4074 14 6.81299 13.5944 6.81299 13.0941V0.9059C6.81299 0.405585 6.4074 0 5.90709 0Z"
              />
              <path
                class="ps-pause-pt2"
                d="M15.1571 0H12.2189C11.7186 0 11.313 0.405585 11.313 0.9059V13.0941C11.313 13.5944 11.7186 14 12.2189 14H15.1571C15.6574 14 16.063 13.5944 16.063 13.0941V0.9059C16.063 0.405585 15.6574 0 15.1571 0Z"
              />
            </g>
          </svg>
        </media-play-button>
        <media-tooltip class="ps-tooltip" trigger="mp-play" delay="0">
          <media-tooltip-label class="ps-tooltip-label"></media-tooltip-label>
        </media-tooltip>

        <media-seek-button class="ps-button ps-seek-button ps-seek-backward" seconds="-10" id="mp-seek-backward">
          <svg class="ps-icon ps-seek-icon" aria-hidden="true" viewBox="0 0 22 14">
            <path
              d="M3.65 2.07888L0.0864 6.7279C-0.0288 6.87812 -0.0288 7.12188 0.0864 7.2721L3.65 11.9211C3.7792 12.0896 4 11.9703 4 11.7321V2.26787C4 2.02968 3.7792 1.9104 3.65 2.07888Z"
            />
            <text class="ps-seek-text" transform="translate(6 12)">10</text>
          </svg>
        </media-seek-button>
        <media-tooltip class="ps-tooltip" trigger="mp-seek-backward" delay="0">
          <media-tooltip-label class="ps-tooltip-label"></media-tooltip-label>
        </media-tooltip>

        <media-seek-button class="ps-button ps-seek-button ps-seek-forward" seconds="10" id="mp-seek-forward">
          <svg class="ps-icon ps-seek-icon" aria-hidden="true" viewBox="0 0 22 14">
            <text class="ps-seek-text" transform="translate(-1 12)">10</text>
            <path
              d="M18.35 11.9211L21.9136 7.2721C22.0288 7.12188 22.0288 6.87812 21.9136 6.7279L18.35 2.07888C18.2208 1.91041 18 2.02968 18 2.26787V11.7321C18 11.9703 18.2208 12.0896 18.35 11.9211Z"
            />
          </svg>
        </media-seek-button>
        <media-tooltip class="ps-tooltip" trigger="mp-seek-forward" delay="0">
          <media-tooltip-label class="ps-tooltip-label"></media-tooltip-label>
        </media-tooltip>

        <media-time-group class="ps-time-display">
          <media-time class="ps-time-value" type="current" toggle></media-time>
          <media-time-separator class="ps-time-separator"> / </media-time-separator>
          <media-time class="ps-time-value" type="duration"></media-time>
        </media-time-group>

        <media-mute-button class="ps-button ps-mute-button" id="mp-mute">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 14">
            <g class="ps-unmuted">
              <path
                d="M6.76786 1.21233L3.98606 3.98924H1.19937C0.593146 3.98924 0.101743 4.51375 0.101743 5.1607V6.96412L0 6.99998L0.101743 7.03583V8.83926C0.101743 9.48633 0.593146 10.0108 1.19937 10.0108H3.98606L6.76773 12.7877C7.23561 13.2547 8 12.9007 8 12.2171V1.78301C8 1.09925 7.23574 0.745258 6.76786 1.21233Z"

              />
              <path
                class="ps-volume-medium"

              />
              <path
                class="ps-volume-high"
                d="M15.5981 0.75L14.7478 1.2719C15.7937 2.9919 16.3468 4.9723 16.3468 7C16.3468 9.0277 15.7937 11.0082 14.7478 12.7281L15.5981 13.25C16.7398 11.3722 17.343 9.211 17.343 7C17.343 4.789 16.7398 2.6268 15.5981 0.75Z"
              />
            </g>
            <g class="ps-muted">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M4.39976 4.98924H1.19937C1.19429 4.98924 1.17777 4.98961 1.15296 5.01609C1.1271 5.04369 1.10174 5.09245 1.10174 5.1607V8.83926C1.10174 8.90761 1.12714 8.95641 1.15299 8.984C1.17779 9.01047 1.1943 9.01084 1.19937 9.01084H4.39977L7 11.6066V2.39357L4.39976 4.98924ZM7.47434 1.92006C7.4743 1.9201 7.47439 1.92002 7.47434 1.92006V1.92006ZM6.76773 12.7877L3.98606 10.0108H1.19937C0.593146 10.0108 0.101743 9.48633 0.101743 8.83926V7.03583L0 6.99998L0.101743 6.96412V5.1607C0.101743 4.51375 0.593146 3.98924 1.19937 3.98924H3.98606L6.76786 1.21233C7.23574 0.745258 8 1.09925 8 1.78301V12.2171C8 12.9007 7.23561 13.2547 6.76773 12.7877Z"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M15.2677 9.30323C15.463 9.49849 15.7796 9.49849 15.9749 9.30323C16.1701 9.10796 16.1701 8.79138 15.9749 8.59612L14.2071 6.82841L15.9749 5.06066C16.1702 4.8654 16.1702 4.54882 15.9749 4.35355C15.7796 4.15829 15.4631 4.15829 15.2678 4.35355L13.5 6.1213L11.7322 4.35348C11.537 4.15822 11.2204 4.15822 11.0251 4.35348C10.8298 4.54874 10.8298 4.86532 11.0251 5.06058L12.7929 6.82841L11.0251 8.59619C10.8299 8.79146 10.8299 9.10804 11.0251 9.3033C11.2204 9.49856 11.537 9.49856 11.7323 9.3033L13.5 7.53552L15.2677 9.30323Z"
              />
            </g>
          </svg>
        </media-mute-button>
        <media-tooltip class="ps-tooltip" trigger="mp-mute" delay="0">
          <media-tooltip-label class="ps-tooltip-label"></media-tooltip-label>
        </media-tooltip>

        <div class="ps-volume">
          <media-volume-slider class="ps-volume-range">
            <media-slider-track class="ps-volume-track">
              <media-slider-fill class="ps-volume-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="ps-volume-thumb"></media-slider-thumb>
          </media-volume-slider>
        </div>

        <span class="ps-spacer"></span>

        <!-- The quality menu hides this trigger itself while the media has no renditions to choose from. -->
        <button
          type="button"
          class="ps-button ps-rendition-button"
          id="mp-rendition"
          commandfor="mp-quality"
          aria-label="Quality"
        >
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 14">
            <path
              d="M2.25 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM9 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm6.75 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"
            />
          </svg>
        </button>
        <media-tooltip class="ps-tooltip" trigger="mp-rendition" delay="0">Quality</media-tooltip>

        <!-- Shows the current rate as text (`attr(data-rate)`) and opens the rate menu. -->
        <media-playback-rate-button
          class="ps-button ps-rate-button"
          id="mp-rate-button"
          commandfor="mp-rate"
        ></media-playback-rate-button>
        <media-tooltip class="ps-tooltip" trigger="mp-rate-button" delay="0">Playback rate</media-tooltip>

        <!-- The audio track menu hides this trigger while the media has a single audio track. -->
        <button
          type="button"
          class="ps-button ps-audio-track-button"
          id="mp-audio-track-button"
          commandfor="mp-audio-track"
          aria-label="Audio"
        >
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 18 16">
            <path d="M9 15A7 7 0 1 1 9 1a7 7 0 0 1 0 14Zm0 1A8 8 0 1 0 9 0a8 8 0 0 0 0 16Z" />

              d="M5.2 6.3a.5.5 0 0 1 .5.5v2.4a.5.5 0 1 1-1 0V6.8a.5.5 0 0 1 .5-.5Zm2.4-2.4a.5.5 0 0 1 .5.5v7.2a.5.5 0 0 1-1 0V4.4a.5.5 0 0 1 .5-.5ZM10 5.5a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.4-.8a.5.5 0 0 1 .5.5v5.6a.5.5 0 0 1-1 0V5.2a.5.5 0 0 1 .5-.5Z"
            />
          </svg>
        </button>
        <media-tooltip class="ps-tooltip" trigger="mp-audio-track-button" delay="0">Audio</media-tooltip>

        <!--
          A plain trigger opens the menu: a media-captions-button linked to one also switches captions on as it opens it.
          The hidden captions button before it only carries the state: `data-active` swaps the trigger's glyph through a
          sibling selector, which WebKit restyles reliably inside a shadow root, where it misses a `:has()` on the menu.
        -->
        <media-captions-button class="ps-captions-state" aria-hidden="true" tabindex="-1"></media-captions-button>

          id="mp-captions-button"

            />
          </svg>
          <svg class="ps-icon ps-captions-off" aria-hidden="true" viewBox="0 0 18 14">
            <path
              d="M5.73219 10.258C5.10819 10.258 4.57009 10.1218 4.11699 9.8488C3.66389 9.5758 3.31429 9.1945 3.06869 8.7057C2.82259 8.2164 2.69958 7.651 2.69958 7.0089C2.69958 6.361 2.82259 5.7926 3.06869 5.3033C3.31429 4.8145 3.66389 4.4322 4.11699 4.1558C4.57009 3.8799 5.10819 3.7417 5.73219 3.7417C6.47049 3.7417 7.07348 3.9219 7.54128 4.2817C8.00958 4.6421 8.30638 5.146 8.43238 5.7939H7.37039C7.28639 5.4282 7.10618 5.1367 6.83039 4.9209C6.55459 4.7051 6.18538 4.5967 5.72348 4.5967C5.09358 4.5967 4.59559 4.8115 4.22939 5.2403C3.86369 5.6695 3.68058 6.2589 3.68058 7.0089C3.68058 7.753 3.86369 8.338 4.22939 8.7638C4.59559 9.1901 5.09368 9.403 5.72348 9.403C6.18538 9.403 6.55459 9.3009 6.83039 9.0968C7.10629 8.8932 7.28649 8.6139 7.37039 8.2599H8.43238C8.30638 8.8839 8.00948 9.3732 7.54128 9.7272C7.07348 10.0812 6.47049 10.258 5.73219 10.258Z"
            />
            <path
              d="M12.6003 10.258C11.9763 10.258 11.4382 10.1218 10.9851 9.8488C10.532 9.5758 10.1824 9.1945 9.93685 8.7057C9.69075 8.2164 9.56775 7.651 9.56775 7.0089C9.56775 6.361 9.69075 5.7926 9.93685 5.3033C10.1824 4.8145 10.532 4.4322 10.9851 4.1558C11.4382 3.8799 11.9763 3.7417 12.6003 3.7417C13.3386 3.7417 13.9416 3.9219 14.4094 4.2817C14.8777 4.6421 15.1745 5.146 15.3005 5.7939H14.2385C14.1545 5.4282 13.9743 5.1367 13.6985 4.9209C13.4227 4.7051 13.0535 4.5967 12.5916 4.5967C11.9617 4.5967 11.4637 4.8115 11.0975 5.2403C10.7318 5.6695 10.5487 6.2589 10.5487 7.0089C10.5487 7.753 10.7318 8.338 11.0975 8.7638C11.4637 9.1901 11.9618 9.403 12.5916 9.403C13.0535 9.403 13.4227 9.3009 13.6985 9.0968C13.9744 8.8932 14.1546 8.6139 14.2385 8.2599H15.3005C15.1745 8.8839 14.8776 9.3732 14.4094 9.7272C13.9416 10.0812 13.3386 10.258 12.6003 10.258Z"
            />
            <path
              d="M15.9891 1C16.5465 1 17 1.4535 17 2.011V11.9891C17 12.5465 16.5465 13 15.9891 13H2.0109C1.4535 13 1 12.5465 1 11.9891V2.0109C1 1.4535 1.4535 0.9999 2.0109 0.9999L15.9891 1ZM15.9891 0H2.0109C0.9003 0 0 0.9003 0 2.0109V11.9891C0 13.0997 0.9003 14 2.0109 14H15.9891C17.0997 14 18 13.0997 18 11.9891V2.0109C18 0.9003 17.0997 0 15.9891 0Z"
            />
          </svg>
        </button>
        <media-tooltip class="ps-tooltip" trigger="mp-captions-button" delay="0">Captions</media-tooltip>

        <media-airplay-button class="ps-button ps-airplay-button" id="mp-airplay">
