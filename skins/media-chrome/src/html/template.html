<!--
  Media Chrome for Video.js 10, HTML element. Stamped into the shadow root of `media-chrome-skin`.
  Keep the markup in step with ../react/index.tsx: same elements, same class names, same icon paths.
-->
<media-container class="media-skin ps-media-chrome" data-theme="media-chrome" data-preset="video">
  <!-- The page's media element (and any other light-DOM children) land here. -->
  <slot></slot>

  <media-poster class="ps-poster">
    <slot name="poster">
      <img class="ps-poster-image" alt="" decoding="async" />
    </slot>
  </media-poster>

  <!-- A mouse click on the picture plays or pauses, as media-gesture-receiver did. -->
  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <!-- media-controller's default hotkeys. -->
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="p" action="togglePictureInPicture"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="j" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="l" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep" value="0.025"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep" value="-0.025"></media-hotkey>
  <media-hotkey keys="&gt;" action="speedUp"></media-hotkey>
  <media-hotkey keys="&lt;" action="speedDown"></media-hotkey>

  <!-- media-loading-indicator in the centred chrome: the half-ring spinner, 0.5s into a stall while playing. -->
  <media-buffering-indicator class="ps-loading" delay="500">
    <svg class="ps-loading-icon" aria-hidden="true" viewBox="0 0 100 100">
      <path d="M73,50c0-12.7-10.3-23-23-23S27,37.3,27,50 M30.9,50c0-10.5,8.5-19.1,19.1-19.1S69.1,39.5,69.1,50" />
    </svg>
  </media-buffering-indicator>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls class="ps-controls">
    <media-controls-content class="ps-layer">
      <!--
        media-control-bar, in the documented order. Every control paints its own translucent background, so the bar
        reads as one strip and each control lightens alone under the pointer. Tooltips carry media-chrome's own words.
      -->
      <media-tooltip-group class="ps-control-bar">
        <media-play-button class="ps-button ps-play-button" id="mc-play">
          <svg class="ps-icon ps-icon-play" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 21 15-9L6 3v18Z" />
          </svg>
          <svg class="ps-icon ps-icon-pause" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 20h4V4H6v16Zm8-16v16h4V4h-4Z" />
          </svg>
        </media-play-button>
        <media-tooltip class="ps-tooltip ps-play-tooltip" trigger="mc-play" side="top" delay="0">
          <span class="ps-tooltip-off">Play</span>
          <span class="ps-tooltip-on">Pause</span>
        </media-tooltip>

        <media-seek-button class="ps-button ps-seek-button" id="mc-seek-backward" seconds="-30">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 20 24">
            <text class="ps-seek-text" transform="translate(2.18 19.87)">30</text>
            <path d="M10 6V3L4.37 7 10 10.94V8a5.54 5.54 0 0 1 1.9 10.48v2.12A7.5 7.5 0 0 0 10 6Z" />
          </svg>
        </media-seek-button>
        <media-tooltip class="ps-tooltip" trigger="mc-seek-backward" side="top" delay="0">
          <span class="ps-tooltip-off">Seek backward</span>
        </media-tooltip>

        <media-seek-button class="ps-button ps-seek-button" id="mc-seek-forward" seconds="30">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 20 24">
            <text class="ps-seek-text" transform="translate(8.9 19.87)">30</text>
            <path d="M10 6V3l5.61 4L10 10.94V8a5.54 5.54 0 0 0-1.9 10.48v2.12A7.5 7.5 0 0 1 10 6Z" />
          </svg>
        </media-seek-button>
        <media-tooltip class="ps-tooltip" trigger="mc-seek-forward" side="top" delay="0">
          <span class="ps-tooltip-off">Seek forward</span>
        </media-tooltip>

        <media-mute-button class="ps-button ps-mute-button" id="mc-mute">
          <svg class="ps-icon ps-icon-volume-off" aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45a4.22 4.22 0 0 0 .05-.63Zm2.5 0a6.84 6.84 0 0 1-.54 2.64L20 16.15A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12ZM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25A6.92 6.92 0 0 1 14 18.7v2.06A9 9 0 0 0 17.69 19l2 2.05L21 19.73l-9-9L4.27 3ZM12 4 9.91 6.09 12 8.18V4Z"
            />
          </svg>
          <svg class="ps-icon ps-icon-volume-low" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4Z" />
          </svg>
          <svg class="ps-icon ps-icon-volume-high" aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"
            />
          </svg>
        </media-mute-button>
        <media-tooltip class="ps-tooltip ps-mute-tooltip" trigger="mc-mute" side="top" delay="0">
          <span class="ps-tooltip-off">Mute</span>
          <span class="ps-tooltip-on">Unmute</span>
        </media-tooltip>

        <!-- media-chrome-range: 10px gaps either side of the track are the wrapper's padding, off the slider itself. -->
        <div class="ps-range ps-volume-range">
          <media-volume-slider class="ps-slider ps-volume-slider">
            <media-slider-track class="ps-track">
              <div class="ps-pointer"></div>
              <media-slider-fill class="ps-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="ps-thumb"></media-slider-thumb>
          </media-volume-slider>
        </div>

        <div class="ps-range ps-time-range">
          <media-time-slider class="ps-slider ps-time-slider">
            <media-slider-track class="ps-track">
              <media-slider-buffer class="ps-buffer"></media-slider-buffer>
              <div class="ps-pointer"></div>
              <media-slider-fill class="ps-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="ps-thumb"></media-slider-thumb>
            <!-- The preview box: the storyboard thumbnail when there is one, the time chip, and its arrow. -->
            <media-slider-preview class="ps-preview" overflow="visible">
              <media-slider-thumbnail class="ps-thumbnail"></media-slider-thumbnail>
              <media-slider-value class="ps-preview-time" type="pointer"></media-slider-value>
            </media-slider-preview>
          </media-time-slider>
        </div>

        <!-- media-time-display showduration: a click on the time flips it to the remaining time. -->
        <media-time-group class="ps-time-display">
          <media-time class="ps-time-current" type="current" toggle></media-time>
          <media-time-separator class="ps-time-separator"> / </media-time-separator>
          <media-time class="ps-time-duration" type="duration"></media-time>
        </media-time-group>

        <media-captions-button class="ps-button ps-captions-button" id="mc-captions">
          <svg class="ps-icon ps-icon-captions-on" aria-hidden="true" viewBox="0 0 26 24">
            <path
              d="M22.83 5.68a2.58 2.58 0 0 0-2.3-2.5c-3.62-.24-11.44-.24-15.06 0a2.58 2.58 0 0 0-2.3 2.5c-.23 4.21-.23 8.43 0 12.64a2.58 2.58 0 0 0 2.3 2.5c3.62.24 11.44.24 15.06 0a2.58 2.58 0 0 0 2.3-2.5c.23-4.21.23-8.43 0-12.64Zm-11.39 9.45a3.07 3.07 0 0 1-1.91.57 3.06 3.06 0 0 1-2.34-1 3.75 3.75 0 0 1-.92-2.67 3.92 3.92 0 0 1 .92-2.77 3.18 3.18 0 0 1 2.43-1 2.94 2.94 0 0 1 2.13.78c.364.359.62.813.74 1.31l-1.43.35a1.49 1.49 0 0 0-1.51-1.17 1.61 1.61 0 0 0-1.29.58 2.79 2.79 0 0 0-.5 1.89 3 3 0 0 0 .49 1.93 1.61 1.61 0 0 0 1.27.58 1.48 1.48 0 0 0 1-.37 2.1 2.1 0 0 0 .59-1.14l1.4.44a3.23 3.23 0 0 1-1.07 1.69Zm7.22 0a3.07 3.07 0 0 1-1.91.57 3.06 3.06 0 0 1-2.34-1 3.75 3.75 0 0 1-.92-2.67 3.88 3.88 0 0 1 .93-2.77 3.14 3.14 0 0 1 2.42-1 3 3 0 0 1 2.16.82 2.8 2.8 0 0 1 .73 1.31l-1.43.35a1.49 1.49 0 0 0-1.51-1.21 1.61 1.61 0 0 0-1.29.58A2.79 2.79 0 0 0 15 12a3 3 0 0 0 .49 1.93 1.61 1.61 0 0 0 1.27.58 1.44 1.44 0 0 0 1-.37 2.1 2.1 0 0 0 .6-1.15l1.4.44a3.17 3.17 0 0 1-1.1 1.7Z"
            />
          </svg>
          <svg class="ps-icon ps-icon-captions-off" aria-hidden="true" viewBox="0 0 26 24">
            <path
              d="M17.73 14.09a1.4 1.4 0 0 1-1 .37 1.579 1.579 0 0 1-1.27-.58A3 3 0 0 1 15 12a2.8 2.8 0 0 1 .5-1.85 1.63 1.63 0 0 1 1.29-.57 1.47 1.47 0 0 1 1.51 1.2l1.43-.34A2.89 2.89 0 0 0 19 9.07a3 3 0 0 0-2.14-.78 3.14 3.14 0 0 0-2.42 1 3.91 3.91 0 0 0-.93 2.78 3.74 3.74 0 0 0 .92 2.66 3.07 3.07 0 0 0 2.34 1 3.07 3.07 0 0 0 1.91-.57 3.17 3.17 0 0 0 1.07-1.74l-1.4-.45c-.083.43-.3.822-.62 1.12Zm-7.22 0a1.43 1.43 0 0 1-1 .37 1.58 1.58 0 0 1-1.27-.58A3 3 0 0 1 7.76 12a2.8 2.8 0 0 1 .5-1.85 1.63 1.63 0 0 1 1.29-.57 1.47 1.47 0 0 1 1.51 1.2l1.43-.34a2.81 2.81 0 0 0-.74-1.32 2.94 2.94 0 0 0-2.13-.78 3.18 3.18 0 0 0-2.43 1 4 4 0 0 0-.92 2.78 3.74 3.74 0 0 0 .92 2.66 3.07 3.07 0 0 0 2.34 1 3.07 3.07 0 0 0 1.91-.57 3.23 3.23 0 0 0 1.07-1.74l-1.4-.45a2.06 2.06 0 0 1-.6 1.07Zm12.32-8.41a2.59 2.59 0 0 0-2.3-2.51C18.72 3.05 15.86 3 13 3c-2.86 0-5.72.05-7.53.17a2.59 2.59 0 0 0-2.3 2.51c-.23 4.207-.23 8.423 0 12.63a2.57 2.57 0 0 0 2.3 2.5c1.81.13 4.67.19 7.53.19 2.86 0 5.72-.06 7.53-.19a2.57 2.57 0 0 0 2.3-2.5c.23-4.207.23-8.423 0-12.63Zm-1.49 12.53a1.11 1.11 0 0 1-.91 1.11c-1.67.11-4.45.18-7.43.18-2.98 0-5.76-.07-7.43-.18a1.11 1.11 0 0 1-.91-1.11c-.21-4.14-.21-8.29 0-12.43a1.11 1.11 0 0 1 .91-1.11C7.24 4.56 10 4.49 13 4.49s5.76.07 7.43.18a1.11 1.11 0 0 1 .91 1.11c.21 4.14.21 8.29 0 12.43Z"
            />
          </svg>
        </media-captions-button>
        <media-tooltip class="ps-tooltip ps-captions-tooltip" trigger="mc-captions" side="top" delay="0">
          <span class="ps-tooltip-off">Enable captions</span>
          <span class="ps-tooltip-on">Disable captions</span>
        </media-tooltip>

        <!-- The rate as text (`1x`), drawn from the button's `data-rate`. -->
        <media-playback-rate-button class="ps-button ps-rate-button" id="mc-rate"></media-playback-rate-button>
        <media-tooltip class="ps-tooltip" trigger="mc-rate" side="top" delay="0">
          <span class="ps-tooltip-off">Playback rate</span>
        </media-tooltip>

        <media-pip-button class="ps-button ps-pip-button" id="mc-pip">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 28 24">
            <path
              d="M24 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h20a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1Zm-1 16H5V5h18v14Zm-3-8h-7v5h7v-5Z"
            />
          </svg>
        </media-pip-button>
        <media-tooltip class="ps-tooltip ps-pip-tooltip" trigger="mc-pip" side="top" delay="0">
          <span class="ps-tooltip-off">Enter picture in picture mode</span>
          <span class="ps-tooltip-on">Exit picture in picture mode</span>
        </media-tooltip>

        <media-fullscreen-button class="ps-button ps-fullscreen-button" id="mc-fullscreen">
          <svg class="ps-icon ps-icon-fullscreen-enter" aria-hidden="true" viewBox="0 0 26 24">
            <path
              d="M16 3v2.5h3.5V9H22V3h-6ZM4 9h2.5V5.5H10V3H4v6Zm15.5 9.5H16V21h6v-6h-2.5v3.5ZM6.5 15H4v6h6v-2.5H6.5V15Z"
            />
          </svg>
          <svg class="ps-icon ps-icon-fullscreen-exit" aria-hidden="true" viewBox="0 0 26 24">
            <path
              d="M18.5 6.5V3H16v6h6V6.5h-3.5ZM16 21h2.5v-3.5H22V15h-6v6ZM4 17.5h3.5V21H10v-6H4v2.5Zm3.5-11H4V9h6V3H7.5v3.5Z"
            />
          </svg>
        </media-fullscreen-button>
        <media-tooltip class="ps-tooltip ps-fullscreen-tooltip" trigger="mc-fullscreen" side="top" delay="0">
          <span class="ps-tooltip-off">Enter fullscreen mode</span>
          <span class="ps-tooltip-on">Exit fullscreen mode</span>
        </media-tooltip>
      </media-tooltip-group>
    </media-controls-content>
  </media-controls>
</media-container>
