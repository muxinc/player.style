<!--
  YT for Video.js 10, HTML element. Stamped into the shadow root of <yt-skin>.
  Keep the markup in step with ../react/index.tsx: same elements, same class names, same icon paths.
-->
<media-container class="media-skin ps-yt" data-theme="yt" data-preset="video">
  <!-- The page's media element (and any other light-DOM children) land here. -->
  <slot></slot>

  <media-poster class="ps-poster">
    <slot name="poster">
      <img class="ps-poster-image" alt="" decoding="async" />
    </slot>
  </media-poster>

  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="j" action="seekStep" value="-10"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="l" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep" value="0.1"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep" value="-0.1"></media-hotkey>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
      <media-dialog-close class="ps-dialog-close">Dismiss</media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <!-- The desktop play/pause flash in the middle of the frame; the original animated a centred play button. -->
  <media-status-indicator class="ps-tap-indicator" actions="togglePaused" close-delay="1000">
    <svg class="ps-tap-icon ps-tap-play" aria-hidden="true" viewBox="0 0 41 41" fill="none">
      <circle cx="20.5" cy="20.5" r="20.5" fill="black" fill-opacity="0.8" />
      <path d="M28 20.5L16 27.8612L16 13.1388L28 20.5Z" fill="#D9D9D9" />
    </svg>
    <svg class="ps-tap-icon ps-tap-pause" aria-hidden="true" viewBox="0 0 41 41" fill="none">
      <circle cx="20.5" cy="20.5" r="20.5" fill="black" fill-opacity="0.8" />
      <path d="M17.7674 13H14V28.0698H17.7674V13Z" fill="#D9D9D9" />
      <path d="M22.4768 13H26.2442V28.0698H22.4768V13Z" fill="#D9D9D9" />
    </svg>
  </media-status-indicator>

  <media-controls class="ps-controls">
    <media-controls-content class="ps-layer">
      <div class="ps-gradient"></div>

      <!-- Narrow viewports: seek / play / seek across the middle, as the original's `centered-chrome`. -->
      <div class="ps-mobile-controls">
        <media-seek-button class="ps-round ps-round-seek" seconds="-30">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 20 24">
            <text class="ps-seek-text" transform="translate(2.18 19.87)">30</text>
            <path d="M10 6V3L4.37 7 10 10.94V8a5.54 5.54 0 0 1 1.9 10.48v2.12A7.5 7.5 0 0 0 10 6Z" />
          </svg>
        </media-seek-button>
        <media-play-button class="ps-round ps-round-play">
          <svg class="ps-icon ps-icon-play" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 21 15-9L6 3v18Z" />
          </svg>
          <svg class="ps-icon ps-icon-pause" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 20h4V4H6v16Zm8-16v16h4V4h-4Z" />
          </svg>
        </media-play-button>
        <media-seek-button class="ps-round ps-round-seek" seconds="30">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 20 24">
            <text class="ps-seek-text" transform="translate(8.9 19.87)">30</text>
            <path d="M10 6V3l5.61 4L10 10.94V8a5.54 5.54 0 0 0-1.9 10.48v2.12A7.5 7.5 0 0 1 10 6Z" />
          </svg>
        </media-seek-button>
      </div>

      <!-- Progress bar, above the control bar. Chapters split the track when the media has a chapters track. -->
      <media-time-slider class="ps-range">
        <media-time-slider-chapters class="ps-chapters">
          <template>
            <div class="ps-chapter">
              <media-slider-track class="ps-track">
                <media-slider-buffer class="ps-buffer"></media-slider-buffer>
                <div class="ps-pointer"></div>
                <media-slider-fill class="ps-fill"></media-slider-fill>
              </media-slider-track>
            </div>
          </template>
        </media-time-slider-chapters>
        <media-slider-thumb class="ps-thumb"></media-slider-thumb>
        <media-slider-preview class="ps-preview" overflow="clamp">
          <media-slider-thumbnail class="ps-thumbnail"></media-slider-thumbnail>
          <media-time-slider-chapter-title class="ps-preview-chapter"></media-time-slider-chapter-title>
          <media-slider-value class="ps-preview-time" type="pointer"></media-slider-value>
        </media-slider-preview>
      </media-time-slider>

      <!-- Control bar. Tooltips are off by default, as in the original (`--media-tooltip-display`). -->
      <media-tooltip-group class="ps-bar">
        <media-play-button class="ps-button ps-play-button ps-play-morph" id="yt-play">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 36 36">
            <g class="ps-play-shadow">
              <g class="ps-play-glyph">
                <path class="ps-play-p1" d="M18.5 14L12 10V26L18.5 22V14Z" />
                <path class="ps-play-p2" d="M18 13.6953L25 18L18 22.3086V13.6953Z" />
              </g>
              <g class="ps-pause-glyph">
                <path class="ps-pause-p1" d="M16 10H12V26H16V10Z" />
                <path class="ps-pause-p2" d="M21 10H25V26H21V10Z" />
              </g>
            </g>
          </svg>
        </media-play-button>
        <media-tooltip class="ps-tooltip" trigger="yt-play" side="top"></media-tooltip>

        <div class="ps-volume">
          <media-mute-button class="ps-button ps-mute-button" id="yt-mute">
            <svg class="ps-icon" aria-hidden="true" viewBox="0 0 36 36">
              <use class="ps-svg-shadow" href="#ps-icon-volume"></use>
              <g class="ps-icon-volume" id="ps-icon-volume">
                <path d="M13 15H9V21H13L18 26V10L13 15Z" />
                <path
                  d="M20 22.0323C21.4818 21.2959 22.5 19.7669 22.5 18C22.5 16.2332 21.4818 14.7041 20 13.9678V22.0323Z"
                />
                <path
                  class="ps-volume-high"
                  d="M20 9.22302V11.2899C22.8915 12.1505 25 14.829 25 18C25 21.171 22.8915 23.8495 20 24.7101V26.777C24.008 25.8675 27 22.2832 27 18C27 13.7168 24.008 10.1325 20 9.22302Z"
                />
              </g>
              <g class="ps-icon-muted">
                <path
                  d="M10.2207 8.80817L8.80762 10.2213L13.2929 14.7065L13 14.9995H9V20.9995H13L18 25.9995V19.4136L22.1922 23.6058C21.5401 24.0942 20.8 24.4715 20 24.7096V26.7764C21.3453 26.4712 22.5761 25.8646 23.6177 25.0314L25.7782 27.1918L27.1924 25.7776L27.1913 25.7766L27.1902 25.7776L10.2207 8.80817Z"
                />
                <path
                  d="M25.8817 22.3478C26.5944 21.0589 27 19.5766 27 17.9995C27 13.7163 24.008 10.132 20 9.22247V11.2894C22.8915 12.1499 25 14.8284 25 17.9995C25 19.0177 24.7826 19.9851 24.3917 20.8578L25.8817 22.3478Z"
                />
                <path
                  d="M22.4139 18.88C22.4704 18.5952 22.5 18.3008 22.5 17.9995C22.5 16.2326 21.4818 14.7036 20 13.9672V16.4661L22.4139 18.88Z"
                />
                <path d="M18 14.4661V9.99945L15.7667 12.2328L18 14.4661Z" />
              </g>
            </svg>
          </media-mute-button>
          <media-tooltip class="ps-tooltip" trigger="yt-mute" side="top"></media-tooltip>
          <div class="ps-volume-range">
            <media-volume-slider class="ps-volume-slider">
              <media-slider-track class="ps-volume-track">
                <media-slider-fill class="ps-volume-fill"></media-slider-fill>
              </media-slider-track>
              <media-slider-thumb class="ps-volume-thumb"></media-slider-thumb>
            </media-volume-slider>
          </div>
        </div>

        <media-time-group class="ps-time">
          <media-time class="ps-time-value" type="current"></media-time>
          <media-time-separator class="ps-time-separator"> / </media-time-separator>
          <media-time class="ps-time-value" type="duration"></media-time>
        </media-time-group>

        <span class="ps-spacer"></span>

        <media-captions-button class="ps-button ps-captions-button" id="yt-captions">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 36 36">
            <use class="ps-svg-shadow" href="#ps-icon-captions"></use>
            <path
              id="ps-icon-captions"
              d="M9 13.4124C9 12.0801 10.0801 11 11.4124 11H24.5876C25.9199 11 27 12.0801 27 13.4124V22.5876C27 23.9199 25.9199 25 24.5876 25H11.4124C10.0801 25 9 23.9199 9 22.5876V13.4124ZM12 16.1134C12 15.4985 12.4985 15 13.1134 15H15.8866C16.5015 15 17 15.4985 17 16.1134V19.8866C17 20.5015 16.5015 21 15.8866 21H13.1134C12.4985 21 12 20.5015 12 19.8866V16.1134ZM13.5517 16.4545H15.4483V19.5455H13.5517V16.4545ZM17 17H15.4483V19H17V17ZM20.1134 15C19.4985 15 19 15.4985 19 16.1134V19.8866C19 20.5015 19.4985 21 20.1134 21H22.8866C23.5015 21 24 20.5015 24 19.8866V16.1134C24 15.4985 23.5015 15 22.8866 15H20.1134ZM22.4483 16.4545H20.5517V19.5455H22.4483V16.4545ZM22.4483 17H24V19H22.4483V17Z"
            />
          </svg>
        </media-captions-button>
        <media-tooltip class="ps-tooltip" trigger="yt-captions" side="top"></media-tooltip>

        <button
          type="button"
          class="ps-button ps-settings-button"
          id="yt-settings-button"
          commandfor="yt-settings"
          aria-label="Settings"
        >
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 36 36">
            <use class="ps-svg-shadow" href="#ps-icon-settings"></use>
            <path
              id="ps-icon-settings"
              d="M11.8153 12.0477L14.2235 12.9602C14.6231 12.6567 15.0599 12.3996 15.5258 12.1971L15.9379 9.66561C16.5985 9.50273 17.2891 9.41632 18 9.41632C18.7109 9.41632 19.4016 9.50275 20.0622 9.66566L20.4676 12.1555C20.9584 12.3591 21.418 12.6227 21.8372 12.9372L24.1846 12.0477C25.1391 13.0392 25.8574 14.2597 26.249 15.6186L24.3196 17.1948C24.3531 17.4585 24.3704 17.7272 24.3704 18C24.3704 18.2727 24.3531 18.5415 24.3196 18.8051L26.249 20.3814C25.8574 21.7403 25.1391 22.9607 24.1846 23.9522L21.8372 23.0628C21.4179 23.3772 20.9584 23.6408 20.4676 23.8445L20.0622 26.3343C19.4016 26.4972 18.7109 26.5836 18 26.5836C17.2891 26.5836 16.5985 26.4972 15.9379 26.3344L15.5258 23.8029C15.0599 23.6003 14.6231 23.3433 14.2236 23.0398L11.8154 23.9523C10.8609 22.9608 10.1426 21.7404 9.75098 20.3815L11.7633 18.7375C11.7352 18.4955 11.7208 18.2495 11.7208 18C11.7208 17.7505 11.7352 17.5044 11.7633 17.2625L9.75098 15.6185C10.1426 14.2596 10.8609 13.0392 11.8153 12.0477ZM18 20.75C19.5188 20.75 20.75 19.5188 20.75 18C20.75 16.4812 19.5188 15.25 18 15.25C16.4812 15.25 15.25 16.4812 15.25 18C15.25 19.5188 16.4812 20.75 18 20.75Z"
            />
          </svg>
        </button>
        <media-tooltip class="ps-tooltip" trigger="yt-settings-button" side="top">Settings</media-tooltip>

        <media-pip-button class="ps-button ps-pip-button" id="yt-pip">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 36 36">
            <use class="ps-svg-shadow" href="#ps-icon-pip"></use>
            <path d="M25 17H17V23H25V17Z" />
            <path
              id="ps-icon-pip"
              d="M7 11C7 9.89543 7.89545 9 9 9H27.0161C28.1207 9 29.0161 9.89543 29.0161 11V24.8837C29.0161 25.9883 28.1207 26.8837 27.0162 26.8837H9C7.89545 26.8837 7 25.9883 7 24.8837V11ZM9 11H27V25H9V11Z"
            />
          </svg>
        </media-pip-button>
        <media-tooltip class="ps-tooltip" trigger="yt-pip" side="top"></media-tooltip>

        <media-fullscreen-button class="ps-button ps-fullscreen-button" id="yt-fullscreen">
          <svg class="ps-icon ps-icon-fs-enter" aria-hidden="true" viewBox="0 0 36 36">
            <use class="ps-svg-shadow" href="#ps-icon-fs-enter"></use>
            <g id="ps-icon-fs-enter">
              <path class="ps-fs-path ps-fs-ul" d="M11 15H9V9H15V11H11V15Z" />
              <path class="ps-fs-path ps-fs-ur" d="M21 11L21 9L27 9L27 15L25 15L25 11L21 11Z" />
              <path class="ps-fs-path ps-fs-dl" d="M15 25L15 27L9 27L9 21L11 21L11 25L15 25Z" />
              <path class="ps-fs-path ps-fs-dr" d="M25 21L27 21L27 27L21 27L21 25L25 25L25 21Z" />
            </g>
          </svg>
          <svg class="ps-icon ps-icon-fs-exit" aria-hidden="true" viewBox="0 0 36 36">
            <use class="ps-svg-shadow" href="#ps-icon-fs-exit"></use>
            <g id="ps-icon-fs-exit">
              <path class="ps-fs-path ps-fs-dr" d="M14 9L16 9L16 16L9 16L9 14L14 14L14 9Z" />
              <path class="ps-fs-path ps-fs-dl" d="M27 14L27 16L20 16L20 9L22 9L22 14L27 14Z" />
              <path class="ps-fs-path ps-fs-ur" d="M9 22L9 20L16 20L16 27L14 27L14 22L9 22Z" />
              <path class="ps-fs-path ps-fs-ul" d="M22 27H20V20H27V22H22V27Z" />
            </g>
          </svg>
        </media-fullscreen-button>
        <media-tooltip class="ps-tooltip" trigger="yt-fullscreen" side="top"></media-tooltip>
      </media-tooltip-group>

      <!-- Settings menu: one root page with a submenu per option group, anchored above the gear button. -->
      <media-menu class="ps-menu" id="yt-settings" side="top" align="end">
        <media-menu-content class="ps-menu-content">
          <media-menu-item class="ps-menu-item ps-menu-item-speed" commandfor="yt-speed">
            <span class="ps-menu-label">Playback Speed</span>
            <span class="ps-menu-hint">
              <span class="ps-menu-hint-value" data-part="hint"></span>
              <svg class="ps-menu-chevron" aria-hidden="true" viewBox="0 0 20 24">
                <path d="m8.12 17.585-.742-.669 4.2-4.665-4.2-4.666.743-.669 4.803 5.335-4.803 5.334Z" />
              </svg>
            </span>
          </media-menu-item>
          <media-menu-item class="ps-menu-item ps-menu-item-quality" commandfor="yt-quality">
            <span class="ps-menu-label">Quality</span>
            <span class="ps-menu-hint">
              <span class="ps-menu-hint-value" data-part="hint"></span>
              <svg class="ps-menu-chevron" aria-hidden="true" viewBox="0 0 20 24">
                <path d="m8.12 17.585-.742-.669 4.2-4.665-4.2-4.666.743-.669 4.803 5.335-4.803 5.334Z" />
              </svg>
            </span>
          </media-menu-item>
          <media-menu-item class="ps-menu-item ps-menu-item-captions" commandfor="yt-captions-menu">
            <span class="ps-menu-label">Subtitles/CC</span>
            <span class="ps-menu-hint">
              <span class="ps-menu-hint-value" data-part="hint"></span>
              <svg class="ps-menu-chevron" aria-hidden="true" viewBox="0 0 20 24">
                <path d="m8.12 17.585-.742-.669 4.2-4.665-4.2-4.666.743-.669 4.803 5.335-4.803 5.334Z" />
              </svg>
            </span>
          </media-menu-item>
        </media-menu-content>

        <media-menu-content class="ps-menu-content ps-menu-submenu" id="yt-speed">
          <media-menu-item class="ps-menu-back">
            <svg class="ps-menu-back-icon" aria-hidden="true" viewBox="0 0 20 24">
              <path d="m11.88 17.585.742-.669-4.2-4.665 4.2-4.666-.743-.669-4.803 5.335 4.803 5.334Z" />
            </svg>
            Playback Speed
          </media-menu-item>
          <media-playback-rate-radio-group class="ps-menu-group">
            <template>
              <media-menu-radio-item class="ps-menu-item ps-menu-radio-item">
                <media-menu-item-indicator class="ps-menu-check" force-mount>
                  <svg class="ps-menu-check-icon" aria-hidden="true" viewBox="0 1 24 24">
                    <path d="m10 15.17 9.193-9.191 1.414 1.414-10.606 10.606-6.364-6.364 1.414-1.414 4.95 4.95Z" />
                  </svg>
                </media-menu-item-indicator>
                <span class="ps-menu-label" data-part="label"></span>
              </media-menu-radio-item>
            </template>
          </media-playback-rate-radio-group>
        </media-menu-content>

        <media-menu-content class="ps-menu-content ps-menu-submenu" id="yt-quality">
          <media-menu-item class="ps-menu-back">
            <svg class="ps-menu-back-icon" aria-hidden="true" viewBox="0 0 20 24">
              <path d="m11.88 17.585.742-.669-4.2-4.665 4.2-4.666-.743-.669-4.803 5.335 4.803 5.334Z" />
            </svg>
            Quality
          </media-menu-item>
          <media-quality-radio-group class="ps-menu-group">
            <template>
              <media-menu-radio-item class="ps-menu-item ps-menu-radio-item">
                <media-menu-item-indicator class="ps-menu-check" force-mount>
                  <svg class="ps-menu-check-icon" aria-hidden="true" viewBox="0 1 24 24">
                    <path d="m10 15.17 9.193-9.191 1.414 1.414-10.606 10.606-6.364-6.364 1.414-1.414 4.95 4.95Z" />
                  </svg>
                </media-menu-item-indicator>
                <span class="ps-menu-label" data-part="label"></span>
                <sup class="ps-menu-tier" data-part="tier"></sup>
              </media-menu-radio-item>
            </template>
          </media-quality-radio-group>
        </media-menu-content>

        <media-menu-content class="ps-menu-content ps-menu-submenu" id="yt-captions-menu">
          <media-menu-item class="ps-menu-back">
            <svg class="ps-menu-back-icon" aria-hidden="true" viewBox="0 0 20 24">
              <path d="m11.88 17.585.742-.669-4.2-4.665 4.2-4.666-.743-.669-4.803 5.335 4.803 5.334Z" />
            </svg>
            Subtitles/CC
          </media-menu-item>
          <media-captions-radio-group class="ps-menu-group">
            <template>
              <media-menu-radio-item class="ps-menu-item ps-menu-radio-item">
                <media-menu-item-indicator class="ps-menu-check" force-mount>
                  <svg class="ps-menu-check-icon" aria-hidden="true" viewBox="0 1 24 24">
                    <path d="m10 15.17 9.193-9.191 1.414 1.414-10.606 10.606-6.364-6.364 1.414-1.414 4.95 4.95Z" />
                  </svg>
                </media-menu-item-indicator>
                <span class="ps-menu-label" data-part="label"></span>
              </media-menu-radio-item>
            </template>
          </media-captions-radio-group>
        </media-menu-content>
      </media-menu>
    </media-controls-content>
  </media-controls>
</media-container>
