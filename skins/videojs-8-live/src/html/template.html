<!--
  Video.js 8 for live video on Video.js 10, HTML element. Stamped into the shadow root of <videojs-8-live-skin>.
  Keep the markup in step with ../react/index.tsx, and with @player.style/videojs-8's template it derives from.
-->
<media-container class="media-skin ps-videojs-8" data-theme="videojs-8" data-preset="live-video">
  <!-- The page's media element (and any other light-DOM children) land here. -->
  <slot></slot>

  <media-poster class="ps-poster">
    <slot name="poster">
      <img class="ps-poster-image" alt="" decoding="async" />
    </slot>
  </media-poster>

  <!-- A click on the picture plays or pauses and a double click toggles fullscreen, as the original's tech did. -->
  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <media-gesture type="doubletap" action="toggleFullscreen" pointer="mouse"></media-gesture>
  <!-- The original's `userActions.hotkeys` set. -->
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>

  <!-- The ring spinner, shown 0.3s into a stall. -->
  <media-buffering-indicator class="ps-loading" delay="300">
    <div class="ps-spinner"></div>
  </media-buffering-indicator>

  <!-- The big play button, centred since 8.0, until playback first starts. -->
  <media-play-button class="ps-big-play">
    <svg class="ps-big-play-icon" aria-hidden="true" viewBox="0 0 48 48">
      <path d="M16 10v28l22-14z" />
    </svg>
  </media-play-button>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
      <media-dialog-close class="ps-dialog-close" aria-label="Close Modal Dialog">
        <svg class="ps-icon" aria-hidden="true" viewBox="0 0 48 48">
          <path
            d="M24 4C12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20S35.05 4 24 4zm10 27.17L31.17 34 24 26.83 16.83 34 14 31.17 21.17 24 14 16.83 16.83 14 24 21.17 31.17 14 34 16.83 26.83 24 34 31.17z"
          />
        </svg>
      </media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls class="ps-controls">
    <media-controls-content class="ps-layer">
      <!-- The control bar: play, volume, the live control in the progress bar's place, then the other buttons. -->
      <div class="ps-bar">
        <media-play-button class="ps-button ps-play-button">
          <svg class="ps-icon ps-icon-play" aria-hidden="true" viewBox="0 0 48 48">
            <path d="M16 10v28l22-14z" />
          </svg>
          <svg class="ps-icon ps-icon-pause" aria-hidden="true" viewBox="0 0 48 48">
            <path d="M12 38h8V10h-8v28zm16-28v28h8V10h-8z" />
          </svg>
          <svg class="ps-icon ps-icon-replay" aria-hidden="true" viewBox="0 0 48 48">
            <path
              d="M24 10V2L14 12l10 10v-8c6.63 0 12 5.37 12 12s-5.37 12-12 12-12-5.37-12-12H8c0 8.84 7.16 16 16 16s16-7.16 16-16-7.16-16-16-16z"
            />
          </svg>
        </media-play-button>

        <!-- The volume panel: the slider slides out of the mute button on hover or keyboard focus. -->
        <div class="ps-volume">
          <media-mute-button class="ps-button ps-mute-button">
            <svg class="ps-icon ps-icon-volume-high" aria-hidden="true" viewBox="0 0 48 48">
              <path
                d="M6 18v12h8l10 10V8L14 18H6zm27 6c0-3.53-2.04-6.58-5-8.05v16.11c2.96-1.48 5-4.53 5-8.06zM28 6.46v4.13c5.78 1.72 10 7.07 10 13.41s-4.22 11.69-10 13.41v4.13c8.01-1.82 14-8.97 14-17.54S36.01 8.28 28 6.46z"
              />
            </svg>
            <svg class="ps-icon ps-icon-volume-medium" aria-hidden="true" viewBox="0 0 48 48">
              <path d="M37 24c0-3.53-2.04-6.58-5-8.05v16.11c2.96-1.48 5-4.53 5-8.06zm-27-6v12h8l10 10V8L18 18h-8z" />
            </svg>
            <svg class="ps-icon ps-icon-volume-low" aria-hidden="true" viewBox="0 0 48 48">
              <path d="M14 18v12h8l10 10V8L22 18h-8z" />
            </svg>
            <svg class="ps-icon ps-icon-volume-mute" aria-hidden="true" viewBox="0 0 48 48">
              <path
                d="M33 24c0-3.53-2.04-6.58-5-8.05v4.42l4.91 4.91c.06-.42.09-.85.09-1.28zm5 0c0 1.88-.41 3.65-1.08 5.28l3.03 3.03C41.25 29.82 42 27 42 24c0-8.56-5.99-15.72-14-17.54v4.13c5.78 1.72 10 7.07 10 13.41zM8.55 6L6 8.55 15.45 18H6v12h8l10 10V26.55l8.51 8.51c-1.34 1.03-2.85 1.86-4.51 2.36v4.13a17.94 17.94 0 0 0 7.37-3.62L39.45 42 42 39.45l-18-18L8.55 6zM24 8l-4.18 4.18L24 16.36V8z"
              />
            </svg>
          </media-mute-button>
          <div class="ps-volume-control">
            <media-volume-slider class="ps-volume-bar">
              <media-slider-track class="ps-volume-track">
                <media-slider-fill class="ps-volume-level"></media-slider-fill>
              </media-slider-track>
              <media-slider-thumb class="ps-handle ps-volume-handle"></media-slider-thumb>
            </media-volume-slider>
          </div>
        </div>

        <!--
          The 7.x+ live UI in place of the progress bar and remaining time: a dot and LIVE, grey behind the live edge and
          red at it. A click seeks to the edge.
        -->
        <div class="ps-live-control">
          <media-live-button class="ps-live-button">
            <svg class="ps-live-indicator" aria-hidden="true" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20" />
            </svg>
            <span class="ps-live-text">LIVE</span>
          </media-live-button>
        </div>

        <media-captions-button class="ps-button ps-captions-button">
          <svg class="ps-icon" aria-hidden="true" viewBox="0 0 48 48">
            <path
              d="M38 8H10c-2.21 0-4 1.79-4 4v24c0 2.21 1.79 4 4 4h28c2.21 0 4-1.79 4-4V12c0-2.21-1.79-4-4-4zM22 22h-3v-1h-4v6h4v-1h3v2a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2zm14 0h-3v-1h-4v6h4v-1h3v2a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2z"
            />
          </svg>
        </media-captions-button>

        <media-pip-button class="ps-button ps-pip-button">
          <svg class="ps-icon ps-icon-pip-enter" aria-hidden="true" viewBox="0 0 48 48">
            <path
              d="M38 22H22v11.99h16V22zm8 16V9.96C46 7.76 44.2 6 42 6H6C3.8 6 2 7.76 2 9.96V38c0 2.2 1.8 4 4 4h36c2.2 0 4-1.8 4-4zm-4 .04H6V9.94h36v28.1z"
            />
          </svg>
          <svg class="ps-icon ps-icon-pip-exit" aria-hidden="true" viewBox="-1 -3 24 24">
            <path
              d="M18 4H4v10h14V4zm4 12V1.98C22 .88 21.1 0 20 0H2C.9 0 0 .88 0 1.98V16c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H2V1.97h18v14.05z"
            />
          </svg>
        </media-pip-button>

        <media-fullscreen-button class="ps-button ps-fullscreen-button">
          <svg class="ps-icon ps-icon-fullscreen-enter" aria-hidden="true" viewBox="0 0 48 48">
            <path d="M14 28h-4v10h10v-4h-6v-6zm-4-8h4v-6h6v-4H10v10zm24 14h-6v4h10V28h-4v6zm-6-24v4h6v6h4V10H28z" />
          </svg>
          <svg class="ps-icon ps-icon-fullscreen-exit" aria-hidden="true" viewBox="0 0 48 48">
            <path d="M10 32h6v6h4V28H10v4zm6-16h-6v4h10V10h-4v6zm12 22h4v-6h6v-4H28v10zm4-22v-6h-4v10h10v-4h-6z" />
          </svg>
        </media-fullscreen-button>
      </div>
    </media-controls-content>
  </media-controls>
</media-container>
